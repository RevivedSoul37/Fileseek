name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Seed a scan root (verify walks Downloads/Documents/Desktop)
        shell: pwsh
        run: |
          $seed = Join-Path $HOME "Desktop" "fileseek-ci-seed"
          New-Item -ItemType Directory -Force -Path $seed | Out-Null
          "semantic search smoke phrase alpha" | Set-Content (Join-Path $seed "alpha-notes.md") -Encoding UTF8
          "print('hello fileseek')" | Set-Content (Join-Path $seed "script.py") -Encoding UTF8
          "budget,spent,remaining" | Set-Content (Join-Path $seed "ledger.csv") -Encoding UTF8
          # The verify suite's five semantic searches need name-matching
          # files on a clean runner (search embeds name+folder+type).
          New-Item -ItemType File -Force -Path (Join-Path $seed "Resume.pdf") | Out-Null
          "video editing timeline notes" | Set-Content (Join-Path $seed "video_editing_timeline.mp4") -Encoding UTF8
          "team,runs,wickets" | Set-Content (Join-Path $seed "cricket_data.csv") -Encoding UTF8
          New-Item -ItemType File -Force -Path (Join-Path $seed "ChatGPT_Installer.exe") | Out-Null
          "print('python script seed')" | Set-Content (Join-Path $seed "python_backup_script.py") -Encoding UTF8

      - name: Unit tests (pytest)
        run: python -m pytest tests/ -q

      - name: Verification suite (live crawler/index; Ollama steps auto-skip)
        run: python scripts/verify_build.py
